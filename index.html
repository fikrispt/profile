<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fikri Saputra — Profile Card</title>
  <meta name="description" content="Kartu profil Fikri Saputra, Creative Designer." />

  <!-- Favicon (tab browser): assets/favicon/favicon.png -->
  <link rel="icon" type="image/png" href="assets/favicon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon/favicon.png" />

  <!-- Link preview (WhatsApp, Telegram, Facebook, X, dll): assets/og/og.jpg (1200×630)
       PENTING: og:image & twitter:image harus URL penuh setelah di-hosting,
       mis. https://domainkamu.com/assets/og/og.jpg
       Gampangnya: demo.html → menu ▾ → "Salin tag <head>" (isi dulu Alamat website). -->

  <!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://fikrispt.github.io/profile/" />
<meta property="og:site_name" content="Fikri Saputra" />
<meta property="og:title" content="Fikri Saputra — Profile Card" />
<meta property="og:description" content="Creative Designer." />
<meta property="og:image" content="https://fikrispt.github.io/profile/assets/og/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Fikri Saputra — Profile Card" />
<meta name="twitter:description" content="Creative Designer." />
<meta name="twitter:image" content="https://fikrispt.github.io/profile/assets/og/og.jpg" />

  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/page.css" />

  <!-- 1) di <head> -->
  <link rel="stylesheet" href="https://fixsarts-auto.github.io/components/headerfooter/headerfooter.css">
  
</head>
<body>
    <!-- Header -->
  <header data-site-header></header>
  <script src="https://fixsarts-auto.github.io/components/headerfooter/headerfooter-config.js"></script>
  <script src="https://fixsarts-auto.github.io/components/headerfooter/headerfooter.js"></script>
  
  <!-- Background glassmorphism (warna orb diatur dari js/config.js) -->
  <div class="glass-bg" aria-hidden="true">
    <span class="bg-img"></span><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  </div>

  <!-- Isi kartu dirender dari js/config.js -->
  <article class="card" id="card" data-autoboot aria-label="Profile card"></article>
  <noscript>Aktifkan JavaScript untuk melihat kartu profil.</noscript>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

    <!-- Footer -->
  <footer data-site-footer></footer>
</body>
</html>
